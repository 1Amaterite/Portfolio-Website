<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="500" fill="#090a0d"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="800" height="48" fill="#0d0e12" stroke="#1c1e26" stroke-width="1"/>
  <text x="24" y="29" fill="#f4f4f5" class="sans" font-size="13" font-weight="600" letter-spacing="0.3">Gueco Cup 2026</text>
  <text x="148" y="29" fill="#52525b" class="mono" font-size="11">/ operations / matchmaking / logistics</text>

  <rect x="660" y="12" width="116" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="674" y="27" fill="#a1a1aa" class="mono" font-size="10">DLSU Futsal Ops</text>

  <!-- Left Sidebar: Operations Console -->
  <rect x="0" y="48" width="190" height="452" fill="#090a0d" stroke="#181920" stroke-width="1"/>
  
  <text x="20" y="78" fill="#52525b" class="mono" font-size="9" letter-spacing="1">EVENT LOGISTICS</text>
  
  <rect x="12" y="90" width="166" height="28" rx="4" fill="#18181b"/>
  <text x="24" y="108" fill="#f4f4f5" class="mono" font-size="11">Match Schedules</text>
  <text x="24" y="140" fill="#71717a" class="mono" font-size="11">Team Rosters (60+)</text>
  <text x="24" y="172" fill="#71717a" class="mono" font-size="11">Payment Ledger</text>
  <text x="24" y="204" fill="#71717a" class="mono" font-size="11">Disciplinary Records</text>

  <line x1="16" y1="235" x2="174" y2="235" stroke="#1c1d24" stroke-width="1"/>
  <text x="20" y="258" fill="#52525b" class="mono" font-size="9" letter-spacing="1">SYSTEM METRICS</text>
  <text x="24" y="280" fill="#a1a1aa" class="mono" font-size="10">Athletes: 64 Active</text>
  <text x="24" y="300" fill="#a1a1aa" class="mono" font-size="10">Fixtures: 16 Total</text>
  <text x="24" y="320" fill="#a1a1aa" class="mono" font-size="10">Attendance: 98.4%</text>
  <text x="24" y="340" fill="#a1a1aa" class="mono" font-size="10">Sync: Live Spreadsheets</text>

  <!-- Main View -->
  <g transform="translate(210, 64)">
    <!-- Header -->
    <text x="0" y="18" fill="#f4f4f5" class="sans" font-size="16" font-weight="600">Tournament Matchmaking &amp; Operations Dashboard</text>
    <text x="0" y="36" fill="#71717a" class="sans" font-size="11">Automated tournament coordination, live attendance reconciliation, and fixture administration</text>

    <!-- Metrics Row -->
    <g transform="translate(0, 52)">
      <rect width="176" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="14" y="22" fill="#71717a" class="mono" font-size="9">TOURNAMENT TEAMS</text>
      <text x="14" y="46" fill="#ffffff" class="mono" font-size="18" font-weight="600">8 Squads</text>

      <rect x="192" width="176" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="206" y="22" fill="#71717a" class="mono" font-size="9">MATCH FIXTURES</text>
      <text x="206" y="46" fill="#ffffff" class="mono" font-size="18" font-weight="600">16 Fixtures</text>

      <rect x="384" width="182" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="398" y="22" fill="#71717a" class="mono" font-size="9">FEE RECONCILIATION</text>
      <text x="398" y="46" fill="#e4e4e7" class="mono" font-size="18" font-weight="600">100% Verified</text>
    </g>

    <!-- Fixture Matrix Table -->
    <g transform="translate(0, 130)">
      <rect width="566" height="236" rx="6" fill="#0d0e12" stroke="#1c1d26" stroke-width="1"/>
      
      <!-- Table Head -->
      <rect width="566" height="32" rx="6" fill="#13141a"/>
      <text x="16" y="20" fill="#71717a" class="mono" font-size="9">FIXTURE</text>
      <text x="100" y="20" fill="#71717a" class="mono" font-size="9">MATCHUP</text>
      <text x="300" y="20" fill="#71717a" class="mono" font-size="9">COURT / TIME</text>
      <text x="440" y="20" fill="#71717a" class="mono" font-size="9">LOGISTICS STATE</text>
      <line x1="0" y1="32" x2="566" y2="32" stroke="#1c1d26" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="16" y="62" fill="#52525b" class="mono" font-size="11">M01</text>
      <text x="100" y="62" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Group A — Match 1</text>
      <text x="300" y="62" fill="#a1a1aa" class="mono" font-size="11">Court 1 • 09:00 PHT</text>
      <rect x="440" y="50" width="86" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="450" y="63" fill="#e4e4e7" class="mono" font-size="9">COMPLETED</text>
      <line x1="0" y1="80" x2="566" y2="80" stroke="#16171e" stroke-width="1"/>

      <!-- Row 2 -->
      <text x="16" y="110" fill="#52525b" class="mono" font-size="11">M02</text>
      <text x="100" y="110" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Group A — Match 2</text>
      <text x="300" y="110" fill="#a1a1aa" class="mono" font-size="11">Court 2 • 09:45 PHT</text>
      <rect x="440" y="98" width="86" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="450" y="111" fill="#e4e4e7" class="mono" font-size="9">COMPLETED</text>
      <line x1="0" y1="128" x2="566" y2="128" stroke="#16171e" stroke-width="1"/>

      <!-- Row 3 -->
      <text x="16" y="158" fill="#52525b" class="mono" font-size="11">M03</text>
      <text x="100" y="158" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Semifinal 1 — Elimination</text>
      <text x="300" y="158" fill="#a1a1aa" class="mono" font-size="11">Court 1 • 14:00 PHT</text>
      <rect x="440" y="146" width="76" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="450" y="159" fill="#f4f4f5" class="mono" font-size="9">LIVE NOW</text>
      <line x1="0" y1="176" x2="566" y2="176" stroke="#16171e" stroke-width="1"/>

      <!-- Row 4 -->
      <text x="16" y="206" fill="#52525b" class="mono" font-size="11">M04</text>
      <text x="100" y="206" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Championship Match</text>
      <text x="300" y="206" fill="#a1a1aa" class="mono" font-size="11">Court 1 • 16:30 PHT</text>
      <rect x="440" y="194" width="86" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="450" y="207" fill="#71717a" class="mono" font-size="9">SCHEDULED</text>
    </g>
  </g>
</svg>
