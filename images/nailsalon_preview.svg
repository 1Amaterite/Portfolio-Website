<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ns-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0c12"/>
      <stop offset="100%" stop-color="#19121e"/>
    </linearGradient>
    <linearGradient id="ns-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ns-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1627"/>
      <stop offset="100%" stop-color="#14101c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#ns-bg)"/>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="800" height="52" fill="#130e1c" stroke="#2a1f38" stroke-width="1"/>
  <rect x="24" y="16" width="20" height="20" rx="6" fill="url(#ns-accent)"/>
  <text x="54" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Lumière Nail Studio</text>
  <text x="210" y="30" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Live Client System</text>

  <!-- Right Actions -->
  <rect x="635" y="14" width="140" height="26" rx="13" fill="url(#ns-accent)"/>
  <text x="655" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">+ New Appointment</text>

  <!-- Left Sidebar (Booking Calendar & Staff) -->
  <rect x="24" y="72" width="240" height="404" rx="12" fill="url(#ns-card)" stroke="#2b203a" stroke-width="1"/>
  
  <text x="44" y="102" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Today's Schedule</text>
  <text x="44" y="120" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Saturday, September 6, 2026</text>

  <!-- Calendar Slot Items -->
  <g transform="translate(40, 140)">
    <!-- Slot 1 -->
    <rect width="208" height="54" rx="8" fill="#241a32" stroke="#3b2b52" stroke-width="1"/>
    <rect x="8" y="10" width="3" height="34" rx="1.5" fill="#ec4899"/>
    <text x="20" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Gel Polish &amp; Nail Art</text>
    <text x="20" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">10:00 AM • Maria Santos</text>

    <!-- Slot 2 -->
    <g transform="translate(0, 64)">
      <rect width="208" height="54" rx="8" fill="#241a32" stroke="#3b2b52" stroke-width="1"/>
      <rect x="8" y="10" width="3" height="34" rx="1.5" fill="#f59e0b"/>
      <text x="20" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Acrylic Full Set</text>
      <text x="20" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">11:30 AM • Chloe Reyes</text>
    </g>

    <!-- Slot 3 -->
    <g transform="translate(0, 128)">
      <rect width="208" height="54" rx="8" fill="#241a32" stroke="#3b2b52" stroke-width="1"/>
      <rect x="8" y="10" width="3" height="34" rx="1.5" fill="#10b981"/>
      <text x="20" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Classic Pedicure Spa</text>
      <text x="20" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">02:00 PM • Alyssa Tan</text>
    </g>

    <!-- Slot 4 -->
    <g transform="translate(0, 192)">
      <rect width="208" height="54" rx="8" fill="#1b1426" stroke="#2c1f3d" stroke-width="1"/>
      <rect x="8" y="10" width="3" height="34" rx="1.5" fill="#6366f1"/>
      <text x="20" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Russian Manicure</text>
      <text x="20" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">04:30 PM • Sophia Cruz</text>
    </g>
  </g>

  <!-- Right Dashboard: Service Catalog & Booking Stats -->
  <g transform="translate(284, 72)">
    <!-- Metric widgets -->
    <rect width="160" height="74" rx="10" fill="url(#ns-card)" stroke="#2f2340" stroke-width="1"/>
    <text x="16" y="26" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Booked Appointments</text>
    <text x="16" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">18 / 20</text>

    <rect x="176" width="160" height="74" rx="10" fill="url(#ns-card)" stroke="#2f2340" stroke-width="1"/>
    <text x="192" y="26" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Double Bookings</text>
    <text x="192" y="56" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">0% Defect</text>

    <rect x="352" width="140" height="74" rx="10" fill="url(#ns-card)" stroke="#2f2340" stroke-width="1"/>
    <text x="368" y="26" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Revenue Est.</text>
    <text x="368" y="56" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">₱24,800</text>

    <!-- Services Catalog Grid -->
    <rect y="92" width="492" height="312" rx="12" fill="#161122" stroke="#2f2240" stroke-width="1"/>
    <text x="20" y="122" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Active Service Catalog &amp; Slot Engine</text>
    
    <!-- Service Cards -->
    <g transform="translate(20, 140)">
      <rect width="218" height="68" rx="8" fill="#20172e" stroke="#36254e" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Signature Gel Extension</text>
      <text x="14" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Duration: 90 mins • 2 Techs</text>
      <text x="14" y="58" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">₱1,850</text>
      <rect x="156" y="44" width="50" height="18" rx="4" fill="#064e3b"/>
      <text x="164" y="56" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Available</text>

      <g transform="translate(234, 0)">
        <rect width="218" height="68" rx="8" fill="#20172e" stroke="#36254e" stroke-width="1"/>
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Express Manicure &amp; Dip</text>
        <text x="14" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Duration: 45 mins • 3 Techs</text>
        <text x="14" y="58" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">₱950</text>
        <rect x="156" y="44" width="50" height="18" rx="4" fill="#064e3b"/>
        <text x="164" y="56" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Available</text>
      </g>

      <g transform="translate(0, 80)">
        <rect width="218" height="68" rx="8" fill="#20172e" stroke="#36254e" stroke-width="1"/>
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Luxury Paraffin Spa</text>
        <text x="14" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Duration: 60 mins • 2 Techs</text>
        <text x="14" y="58" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">₱1,400</text>
        <rect x="156" y="44" width="50" height="18" rx="4" fill="#451a03"/>
        <text x="167" y="56" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">1 Left</text>
      </g>

      <g transform="translate(234, 80)">
        <rect width="218" height="68" rx="8" fill="#20172e" stroke="#36254e" stroke-width="1"/>
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Custom 3D Chrome Art</text>
        <text x="14" y="42" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Duration: 120 mins • Senior</text>
        <text x="14" y="58" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">₱2,500</text>
        <rect x="156" y="44" width="50" height="18" rx="4" fill="#4c0519"/>
        <text x="166" y="56" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Full</text>
      </g>
    </g>
  </g>
</svg>
