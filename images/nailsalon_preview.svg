<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="500" fill="#090a0d"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="800" height="48" fill="#0d0e12" stroke="#1c1e26" stroke-width="1"/>
  <text x="24" y="29" fill="#f4f4f5" class="sans" font-size="13" font-weight="600" letter-spacing="0.3">Nails Salon System</text>
  <text x="160" y="29" fill="#52525b" class="mono" font-size="11">/ client / reservations / schedule</text>

  <rect x="670" y="12" width="106" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="682" y="27" fill="#a1a1aa" class="mono" font-size="10">Vercel • Production</text>

  <!-- Left Sidebar: Slot & Filter Engine -->
  <rect x="0" y="48" width="210" height="452" fill="#090a0d" stroke="#181920" stroke-width="1"/>
  
  <text x="20" y="78" fill="#52525b" class="mono" font-size="9" letter-spacing="1">TIME MATRIX</text>
  
  <rect x="12" y="90" width="186" height="30" rx="4" fill="#18181b"/>
  <text x="24" y="110" fill="#f4f4f5" class="mono" font-size="11">10:00 AM — Confirmed</text>

  <rect x="12" y="128" width="186" height="30" rx="4" fill="#121318"/>
  <text x="24" y="148" fill="#a1a1aa" class="mono" font-size="11">11:30 AM — Confirmed</text>

  <rect x="12" y="166" width="186" height="30" rx="4" fill="#121318"/>
  <text x="24" y="186" fill="#a1a1aa" class="mono" font-size="11">02:00 PM — Confirmed</text>

  <rect x="12" y="204" width="186" height="30" rx="4" fill="#121318"/>
  <text x="24" y="224" fill="#71717a" class="mono" font-size="11">03:30 PM — Open Slot</text>

  <line x1="16" y1="252" x2="194" y2="252" stroke="#1c1d24" stroke-width="1"/>
  <text x="20" y="275" fill="#52525b" class="mono" font-size="9" letter-spacing="1">CONFLICT ENGINE</text>
  <text x="24" y="297" fill="#a1a1aa" class="mono" font-size="10">Double-Booking: 0% Defect</text>
  <text x="24" y="317" fill="#a1a1aa" class="mono" font-size="10">Concurrency: Mutex Lock</text>
  <text x="24" y="337" fill="#a1a1aa" class="mono" font-size="10">API Status: 200 OK</text>

  <!-- Main View -->
  <g transform="translate(230, 64)">
    <!-- Header -->
    <text x="0" y="18" fill="#f4f4f5" class="sans" font-size="16" font-weight="600">Service Catalog &amp; Active Reservations</text>
    <text x="0" y="36" fill="#71717a" class="sans" font-size="11">Production client management system eliminating booking collisions and scheduling deadlocks</text>

    <!-- Metrics Row -->
    <g transform="translate(0, 52)">
      <rect width="170" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="14" y="22" fill="#71717a" class="mono" font-size="9">DAILY RESERVATIONS</text>
      <text x="14" y="46" fill="#ffffff" class="mono" font-size="18" font-weight="600">18 Booked</text>

      <rect x="186" width="170" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="200" y="22" fill="#71717a" class="mono" font-size="9">COLLISION RATE</text>
      <text x="200" y="46" fill="#ffffff" class="mono" font-size="18" font-weight="600">0 Collisions</text>

      <rect x="372" width="174" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="386" y="22" fill="#71717a" class="mono" font-size="9">SYSTEM DEPLOYMENT</text>
      <text x="386" y="46" fill="#e4e4e7" class="mono" font-size="18" font-weight="600">Live on Vercel</text>
    </g>

    <!-- Services Table -->
    <g transform="translate(0, 130)">
      <rect width="546" height="236" rx="6" fill="#0d0e12" stroke="#1c1d26" stroke-width="1"/>
      
      <!-- Table Head -->
      <rect width="546" height="32" rx="6" fill="#13141a"/>
      <text x="16" y="20" fill="#71717a" class="mono" font-size="9">SERVICE NAME</text>
      <text x="230" y="20" fill="#71717a" class="mono" font-size="9">DURATION</text>
      <text x="340" y="20" fill="#71717a" class="mono" font-size="9">RESERVATION STATE</text>
      <text x="470" y="20" fill="#71717a" class="mono" font-size="9">ACTION</text>
      <line x1="0" y1="32" x2="546" y2="32" stroke="#1c1d26" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="16" y="62" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Gel Polish &amp; Structure Coat</text>
      <text x="230" y="62" fill="#a1a1aa" class="mono" font-size="11">60 mins</text>
      <rect x="340" y="50" width="86" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="350" y="63" fill="#e4e4e7" class="mono" font-size="9">RESERVED</text>
      <text x="470" y="62" fill="#71717a" class="mono" font-size="10">Assigned</text>
      <line x1="0" y1="80" x2="546" y2="80" stroke="#16171e" stroke-width="1"/>

      <!-- Row 2 -->
      <text x="16" y="110" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Acrylic Full Set &amp; Art</text>
      <text x="230" y="110" fill="#a1a1aa" class="mono" font-size="11">90 mins</text>
      <rect x="340" y="98" width="86" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="350" y="111" fill="#e4e4e7" class="mono" font-size="9">RESERVED</text>
      <text x="470" y="110" fill="#71717a" class="mono" font-size="10">Assigned</text>
      <line x1="0" y1="128" x2="546" y2="128" stroke="#16171e" stroke-width="1"/>

      <!-- Row 3 -->
      <text x="16" y="158" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Classic Pedicure Treatment</text>
      <text x="230" y="158" fill="#a1a1aa" class="mono" font-size="11">45 mins</text>
      <rect x="340" y="146" width="76" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="350" y="159" fill="#f4f4f5" class="mono" font-size="9">OPEN</text>
      <text x="470" y="158" fill="#a1a1aa" class="mono" font-size="10">Book Slot</text>
      <line x1="0" y1="176" x2="546" y2="176" stroke="#16171e" stroke-width="1"/>

      <!-- Row 4 -->
      <text x="16" y="206" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Paraffin Hand Treatment</text>
      <text x="230" y="206" fill="#a1a1aa" class="mono" font-size="11">40 mins</text>
      <rect x="340" y="194" width="86" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="350" y="207" fill="#e4e4e7" class="mono" font-size="9">RESERVED</text>
      <text x="470" y="206" fill="#71717a" class="mono" font-size="10">Assigned</text>
    </g>
  </g>
</svg>
