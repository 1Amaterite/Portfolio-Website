<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="500" fill="#090a0d"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="800" height="48" fill="#0d0e12" stroke="#1c1e26" stroke-width="1"/>
  <text x="24" y="29" fill="#f4f4f5" class="sans" font-size="13" font-weight="600" letter-spacing="0.3">Ne-goshow</text>
  <text x="100" y="29" fill="#52525b" class="mono" font-size="11">/ app / (admin) / bulletins</text>
  
  <rect x="660" y="12" width="116" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="674" y="27" fill="#a1a1aa" class="mono" font-size="10">NextAuth • Admin</text>

  <!-- Sidebar -->
  <rect x="0" y="48" width="170" height="452" fill="#090a0d" stroke="#181920" stroke-width="1"/>
  
  <text x="20" y="78" fill="#52525b" class="mono" font-size="9" letter-spacing="1">ROUTING TREE</text>
  
  <rect x="12" y="90" width="146" height="28" rx="4" fill="#18181b"/>
  <text x="26" y="108" fill="#f4f4f5" class="mono" font-size="11">/bulletins</text>
  <text x="26" y="142" fill="#71717a" class="mono" font-size="11">/validation-queue</text>
  <text x="26" y="174" fill="#71717a" class="mono" font-size="11">/state-cache</text>
  <text x="26" y="206" fill="#71717a" class="mono" font-size="11">/audit-logs</text>

  <line x1="16" y1="235" x2="154" y2="235" stroke="#1c1d24" stroke-width="1"/>
  <text x="20" y="258" fill="#52525b" class="mono" font-size="9" letter-spacing="1">STACK TELEMETRY</text>
  <text x="24" y="280" fill="#a1a1aa" class="mono" font-size="10">ORM: Prisma 5.x</text>
  <text x="24" y="300" fill="#a1a1aa" class="mono" font-size="10">DB: Supabase PG</text>
  <text x="24" y="320" fill="#a1a1aa" class="mono" font-size="10">Query: TanStack v5</text>
  <text x="24" y="340" fill="#a1a1aa" class="mono" font-size="10">Auth: Session JWT</text>

  <!-- Main View -->
  <g transform="translate(190, 64)">
    <!-- Header -->
    <text x="0" y="18" fill="#f4f4f5" class="sans" font-size="16" font-weight="600">Bulletin Publishing &amp; State Engine</text>
    <text x="0" y="36" fill="#71717a" class="sans" font-size="11">Protected administrative route with server-side validation and optimistic state mutations</text>

    <!-- Metrics Row -->
    <g transform="translate(0, 52)">
      <rect width="186" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="14" y="22" fill="#71717a" class="mono" font-size="9">ACTIVE RECORDS</text>
      <text x="14" y="46" fill="#ffffff" class="mono" font-size="18" font-weight="600">128 items</text>

      <rect x="200" width="186" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="214" y="22" fill="#71717a" class="mono" font-size="9">VALIDATION QUEUE</text>
      <text x="214" y="46" fill="#ffffff" class="mono" font-size="18" font-weight="600">3 pending</text>

      <rect x="400" width="186" height="60" rx="6" fill="#101116" stroke="#22232c" stroke-width="1"/>
      <text x="414" y="22" fill="#71717a" class="mono" font-size="9">SERVER STATE</text>
      <text x="414" y="46" fill="#e4e4e7" class="mono" font-size="18" font-weight="600">Synchronized</text>
    </g>

    <!-- Data Table -->
    <g transform="translate(0, 130)">
      <rect width="586" height="236" rx="6" fill="#0d0e12" stroke="#1c1d26" stroke-width="1"/>
      
      <!-- Table Head -->
      <rect width="586" height="32" rx="6" fill="#13141a"/>
      <text x="16" y="20" fill="#71717a" class="mono" font-size="9">ID</text>
      <text x="70" y="20" fill="#71717a" class="mono" font-size="9">BULLETIN ENTITY</text>
      <text x="310" y="20" fill="#71717a" class="mono" font-size="9">MUTATION STATUS</text>
      <text x="470" y="20" fill="#71717a" class="mono" font-size="9">SERVER CACHE</text>
      <line x1="0" y1="32" x2="586" y2="32" stroke="#1c1d26" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="16" y="62" fill="#52525b" class="mono" font-size="11">#0142</text>
      <text x="70" y="62" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Tech Summit Keynote Speaker Schedule</text>
      <rect x="310" y="50" width="80" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="320" y="63" fill="#e4e4e7" class="mono" font-size="9">PUBLISHED</text>
      <text x="470" y="62" fill="#a1a1aa" class="mono" font-size="10">200 OK • Fresh</text>
      <line x1="0" y1="80" x2="586" y2="80" stroke="#16171e" stroke-width="1"/>

      <!-- Row 2 -->
      <text x="16" y="110" fill="#52525b" class="mono" font-size="11">#0141</text>
      <text x="70" y="110" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Academic Congress Call for Submissions</text>
      <rect x="310" y="98" width="94" height="18" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="320" y="111" fill="#f4f4f5" class="mono" font-size="9">UNDER REVIEW</text>
      <text x="470" y="110" fill="#a1a1aa" class="mono" font-size="10">Stale • Revalidating</text>
      <line x1="0" y1="128" x2="586" y2="128" stroke="#16171e" stroke-width="1"/>

      <!-- Row 3 -->
      <text x="16" y="158" fill="#52525b" class="mono" font-size="11">#0140</text>
      <text x="70" y="158" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Campus Hackathon Partner Directory</text>
      <rect x="310" y="146" width="80" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="320" y="159" fill="#e4e4e7" class="mono" font-size="9">PUBLISHED</text>
      <text x="470" y="158" fill="#a1a1aa" class="mono" font-size="10">200 OK • Fresh</text>
      <line x1="0" y1="176" x2="586" y2="176" stroke="#16171e" stroke-width="1"/>

      <!-- Row 4 -->
      <text x="16" y="206" fill="#52525b" class="mono" font-size="11">#0139</text>
      <text x="70" y="206" fill="#f4f4f5" class="sans" font-size="12" font-weight="500">Student Government Audit Disclosure</text>
      <rect x="310" y="194" width="80" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="320" y="207" fill="#e4e4e7" class="mono" font-size="9">PUBLISHED</text>
      <text x="470" y="206" fill="#a1a1aa" class="mono" font-size="10">200 OK • Fresh</text>
    </g>
  </g>
</svg>
